<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Contact Desmond Khoo.">
  <title>Say Hi — Desmond Khoo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .form-status{
      min-height:1.4em;
      margin:22px 0 0;
      color:var(--muted);
      font-size:11px;
      line-height:1.5;
    }
  </style>
</head>
<body>
  <header class="site-header contact-header">
    <a class="brand" href="index.html">DESMOND KHOO</a>
    <nav><a href="index.html">Back home</a></nav>
  </header>

  <main class="contact-page">
    <p class="eyebrow">CONTACT</p>
    <h1>Say Hi.</h1>
    <p class="contact-intro">
      Have a question, an idea, or something worth thinking through?
    </p>

    <form
      id="contact-form"
      class="contact-form"
      action="https://formspree.io/f/xaqrrbzr"
      method="POST"
    >
      <input type="hidden" name="_subject" value="New message from desmondkhoo.com">

      <label>
        <span>Name</span>
        <input type="text" name="name" autocomplete="name" required>
      </label>

      <label>
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>

      <label>
        <span>Message</span>
        <textarea name="message" rows="7" required></textarea>
      </label>

      <button type="submit">Send message ↗</button>
      <p id="form-status" class="form-status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const endpoint = form.getAttribute("action");

      if (endpoint.includes("YOUR_FORM_ID")) {
        status.textContent = "Formspree is not connected yet. Add your Formspree form ID first.";
        return;
      }

      status.textContent = "Sending…";

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          body: new FormData(form),
          headers: { "Accept": "application/json" }
        });

        if (response.ok) {
          form.reset();
          status.textContent = "Message sent. Thanks for saying hi — I’ll get back to you soon.";
        } else {
          const data = await response.json().catch(() => ({}));
          status.textContent =
            data?.errors?.map(error => error.message).join(", ") ||
            "Something went wrong. Please try again.";
        }
      } catch (error) {
        status.textContent = "Something went wrong. Please try again.";
      }
    });
  </script>
</body>
</html>
